<meta charset="utf-8">

<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1a1d23; --muted:#6b7280; --line:#d9dce3; --brand:#1d4ed8; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  label:first-of-type { margin-top:0; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--brand); border-color:var(--brand); }
  #sug { display:none; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-top:4px; background:#fff; }
  #sug div { padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:15px; }
  #sug div:last-child { border-bottom:0; }
  #sug div:hover, #sug div.on { background:#eef2ff; }
  button { width:100%; padding:14px; font-size:17px; font-weight:700; border:0; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top:12px; padding:12px; border-radius:8px; display:none; font-weight:600; }
  #msg.ok { display:block; background:#dcfce7; color:var(--ok); }
  #msg.err { display:block; background:#fee2e2; color:var(--err); }
</style>
</head>

      <div id="sug" role="listbox"></div>

    </div>

    <div class="card">

      <label>Skybags Sale<input type="number" name="SKY Sale" inputmode="decimal" step="any" min="0"></label>
      <label>Aristocrat Sale<input type="number" name="ARI Sale" inputmode="decimal" step="any" min="0"></label>
      <label>VIP Total Sale<input type="number" name="VIP Total Sale" inputmode="decimal" step="any" min="0"></label>
      <label>VIP MTD Sale<input type="number" name="VIP MTD Sale" inputmode="decimal" step="any" min="0"></label>
    </div>

    <div class="card">
      <h2>AT / KT</h2>

      <label>KT<input type="number" name="KT" inputmode="decimal" step="any" min="0"></label>
      <label>AT Total Sale<input type="number" name="AT TOTAL SALE" inputmode="decimal" step="any" min="0"></label>
      <label>AT MTD<input type="number" name="AT MTD" inputmode="decimal" step="any" min="0"></label>
    </div>

    <div class="card">
      <h2>Safari</h2>
      <label>Safari Sale<input type="number" name="SAFARI SALE" inputmode="decimal" step="any" min="0"></label>
      <label>Safari MTD<input type="number" name="SAFARI MTD" inputmode="decimal" step="any" min="0"></label>
    </div>

    <button id="btn" type="submit">Submit</button>
    <div id="msg"></div>
  </form>
</div>

const f = document.getElementById("f"), btn = document.getElementById("btn"), msg = document.getElementById("msg"), sel = document.getElementById("store");
const norm = t => t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
let chosen = null;
const sug = document.getElementById("sug"), codeEl = document.getElementById("code");
const findStore = () => chosen && norm(chosen.name) === norm(sel.value) ? chosen : (STORES.find(s => norm(s.name) === norm(sel.value)) || null);
function setCode() { const s = findStore(); codeEl.textContent = s ? "SAP code: " + s.code : ""; }
function render() {
  const words = norm(sel.value).split(" ").filter(Boolean);
  chosen = null; setCode();
  if (!words.length) { sug.style.display = "none"; return; }
  const hits = STORES.filter(s => { const n = norm(s.name); return words.every(w => n.includes(w)); }).slice(0, 30);
  if (!hits.length) { sug.innerHTML = '<div style="color:var(--muted)">No store matches</div>'; sug.style.display = "block"; return; }
  sug.innerHTML = "";
  hits.forEach(s => {
    const d = document.createElement("div");
    d.textContent = s.name;
    d.addEventListener("mousedown", e => { e.preventDefault(); pick(s); });
    sug.appendChild(d);
  });
  sug.style.display = "block";
}
function pick(s) { chosen = s; sel.value = s.name; sug.style.display = "none"; setCode(); }
sel.addEventListener("input", render);
sel.addEventListener("focus", () => { if (sel.value && !findStore()) render(); });
sel.addEventListener("blur", () => setTimeout(() => sug.style.display = "none", 150));
sel.addEventListener("keydown", e => { if (e.key === "Enter" && sug.style.display === "block" && sug.firstChild && !findStore()) { e.preventDefault(); sug.firstChild.dispatchEvent(new Event("mousedown")); } });

function show(text, cls) { msg.textContent = text; msg.className = cls; }

f.addEventListener("submit", async e => {
  e.preventDefault();
  if (!SHEET_URL || SHEET_URL.startsWith("PASTE")) { show("Not connected to Excel/Sheet yet — SHEET_URL is empty.", "err"); return; }
  btn.disabled = true; btn.textContent = "Submitting…"; msg.className = "";
  const store = findStore();
  if (!store) { show("Please pick a store from the list.", "err"); return; }
  const values = {};
  f.querySelectorAll("input[name]").forEach(i => values[i.name] = i.value);
  const data = { code: store.code, values };
  try {
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) });
    show("Submitted ✓ — saved to the sheet.", "ok");
    f.reset(); chosen = null; setCode();
  } catch (err) {
    show("Could not submit. Check internet and try again.", "err");
  }
  btn.disabled = false; btn.textContent = "Submit";
});
